# Rocky Linux 10 ships GCC 14. Use GCC 15 from gcc-toolset-15.

[binaries]
c = '/opt/rh/gcc-toolset-15/root/usr/bin/gcc'
cpp = '/opt/rh/gcc-toolset-15/root/usr/bin/g++'
